version: "3.8"

services:
  neo4j:
    image: neo4j:5.22-community
    container_name: fraud_neo4j
    ports:
      - "7474:7474"   # interface web Neo4j Browser
      - "7687:7687"   # protocole Bolt
    environment:
      - NEO4J_AUTH=neo4j/frauddetection
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "frauddetection", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build: .
    container_name: fraud_dashboard
    ports:
      - "8501:8501"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=frauddetection
    depends_on:
      - neo4j
    volumes:
      - ./data:/app/data
    command: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  neo4j_data:
